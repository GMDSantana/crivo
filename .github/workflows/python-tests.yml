name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=crivo

      - name: Check that the package installs and runs
        run: |
          pip install .
          cd /tmp && echo "10.0.0.1 example.com" | crivo

  minimum-versions:
    # Tests the oldest dependency versions allowed by the requirements files.
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the lowest allowed dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --resolution lowest-direct -r requirements-dev.txt

      - name: Run tests
        run: pytest
